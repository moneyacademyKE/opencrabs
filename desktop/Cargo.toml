[package]
name = "opencrabs-desktop-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.9", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "EventTarget", "HtmlTextAreaElement", "HtmlInputElement", "Window", "Navigator", "Clipboard"] }
